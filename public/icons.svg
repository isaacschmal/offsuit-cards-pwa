<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft photorealistic drop shadow cast by the right card onto the left card -->
    <filter id="soft-card-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="-10" dy="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.32" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep pitch black canvas -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Two minimal cards in the lower-left corner matching app style -->
  <!-- Left Card: Ace of Spades (w: 168, h: 246, rx: 32) at x: 48, y: 218 -->
  <g id="card-left" transform="translate(48, 218)">
    <rect x="0" y="0" width="168" height="246" rx="32" fill="#ffffff" />
    <!-- Rank 'A' top-left -->
    <text x="26" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="600" fill="#18181b">A</text>
    <!-- Spade suit bottom-left -->
    <g transform="translate(26, 172) scale(1.6)">
      <path d="M12 2C7 8 3 11.5 3 15a5.5 5.5 0 0 0 7.5 5.1L9 22h6l-1.5-1.9A5.5 5.5 0 0 0 21 15c0-3.5-4-7-9-13z" fill="#18181b" />
    </g>
  </g>

  <!-- Right Card: Ace of Hearts (w: 168, h: 246, rx: 32) at x: 162, y: 218 with soft drop shadow -->
  <g id="card-right" transform="translate(162, 218)">
    <rect x="0" y="0" width="168" height="246" rx="32" fill="#ffffff" filter="url(#soft-card-shadow)" />
    <!-- Rank 'A' top-left in Offsuit red -->
    <text x="26" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="600" fill="#ef4444">A</text>
    <!-- Heart suit bottom-left in Offsuit red -->
    <g transform="translate(26, 174) scale(1.6)">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ef4444" />
    </g>
  </g>
</svg>